name: Verificar Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar el SDK' }
      - name: Compilar sin clave privada
        shell: pwsh
        run: ./source/android/build.ps1 -Sdk $env:ANDROID_HOME -Jdk $env:JAVA_HOME -Unsigned
      - name: Pruebas contables y de reconocimiento
        shell: pwsh
        run: ./source/android/test.ps1 -Sdk $env:ANDROID_HOME -Jdk $env:JAVA_HOME
